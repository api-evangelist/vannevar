aid: vannevar
name: Vannevar Labs
description: Vannevar Labs is a defense technology company that builds agentic AI for
  national security missions. Its Agent Orchestration platform fuses defense-grade
  foundational data, mission requirements, and strategic reasoning into mission-focused
  AI agents — spanning course-of-action, force-protection, information-operations, and
  cross-border pattern-analysis agents — used from tactical kill-chain decisions to
  theater-level campaigns. The company collects hard-to-reach data from adversarial
  information environments to train models for national security, and works across
  mission areas including Indo-Pacific deterrence, homeland security, and intelligent
  statecraft. Backed by General Catalyst; no public developer portal or API surface
  is published.
